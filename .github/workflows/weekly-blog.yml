name: Weekly Blog Generation

on:
  schedule:
    # Runs at 05:00 UTC (09:00 AM Dubai Time) every Monday
    - cron: '0 5 * * 1'
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate new blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog.mjs

      - name: Compile blogs list
        run: node scripts/compile-blogs.mjs

      - name: Build Next.js application (Verify)
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogs/ public/blog/ lib/blog-data.ts
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new blog generated or no changes to commit."
          else
            git commit -m "chore(blog): auto-generate weekly blog post [skip ci]"
            git push
          fi
